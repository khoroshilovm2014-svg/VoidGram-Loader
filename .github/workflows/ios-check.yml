name: NovaStore iOS build check

on:
  workflow_dispatch:
  push:
    branches:
      - novastore-ios
    paths:
      - ".gitmodules"
      - "README.md"
      - ".github/workflows/ios-check.yml"
      - "scripts/**"
      - "branding/**"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout NovaStore
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Apply NovaStore branding
        run: |
          python3 scripts/apply-novastore-branding.py
          mkdir -p NovaStoreCore/AltStore/Resources/Icons.xcassets/AppIcon.appiconset
          swift scripts/generate-novastore-icon.swift NovaStoreCore/AltStore/Resources/Icons.xcassets/AppIcon.appiconset/1024.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("NovaStoreCore/AltStore/Resources/Icons.xcassets/AppIcon.appiconset/Contents.json")
          data = json.loads(p.read_text())
          data["images"] = [{"filename":"1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}]
          p.write_text(json.dumps(data, indent=2) + chr(10))
          PY
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" NovaStoreCore/AltStore/Info.plist | grep -Fx NovaStore

      - name: Verify Xcode project and scheme
        run: |
          test -d NovaStoreCore/AltStore.xcodeproj
          xcodebuild -list -project NovaStoreCore/AltStore.xcodeproj

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project NovaStoreCore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-experimental-feature IsolatedDeinit' \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/SideStore.app
          if-no-files-found: error
          retention-days: 7
