name: NovaStore iOS build

on:
  workflow_dispatch:
  push:
    branches:
      - novastore-ios
    paths:
      - ".gitmodules"
      - "README.md"
      - ".github/workflows/ios-check.yml"
      - "scripts/**"
      - "branding/**"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout NovaStore
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Apply NovaStore branding
        run: |
          python3 scripts/apply-novastore-branding.py
          swift scripts/generate-novastore-icon.swift NovaStoreCore/AltStore/Resources/Assets.xcassets/SideStore.imageset/1024.png
          mkdir -p NovaStoreCore/AltWidget/Assets.xcassets/SideStore.imageset
          cp NovaStoreCore/AltStore/Resources/Assets.xcassets/SideStore.imageset/1024.png NovaStoreCore/AltWidget/Assets.xcassets/SideStore.imageset/1024.png
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" NovaStoreCore/AltStore/Info.plist | grep -Fx NovaStore
          grep -F 'BASE_BUNDLE_ID = com.novastore.app' NovaStoreCore/Build.xcconfig

      - name: Verify Xcode project and scheme
        run: |
          test -d NovaStoreCore/AltStore.xcodeproj
          xcodebuild -list -project NovaStoreCore/AltStore.xcodeproj

      - name: Compile for iOS Simulator
        run: |
          xcodebuild \
            -project NovaStoreCore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-experimental-feature IsolatedDeinit' \
            MAIN_BUNDLE_IDENTIFIER=com.novastore.app \
            APP_GROUP_IDENTIFIER=com.novastore.app \
            PRODUCT_NAME=NovaStore \
            build

      - name: Archive for physical iPhone
        run: |
          xcodebuild \
            -project NovaStoreCore/AltStore.xcodeproj \
            -scheme SideStore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NovaStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            OTHER_SWIFT_FLAGS='$(inherited) -enable-experimental-feature IsolatedDeinit' \
            MAIN_BUNDLE_IDENTIFIER=com.novastore.app \
            APP_GROUP_IDENTIFIER=com.novastore.app \
            PRODUCT_NAME=NovaStore \
            archive

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build/NovaStore.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          test "$DISPLAY_NAME" = "NovaStore"
          test "$BUNDLE_ID" = "com.novastore.app"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../../NovaStore-unsigned.ipa Payload)
          test -s NovaStore-unsigned.ipa
          echo "Created unsigned IPA: $BUNDLE_ID"

      - name: Upload iPhone IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-unsigned-IPA
          path: NovaStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NovaStore-iOS-Simulator
          path: build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7
