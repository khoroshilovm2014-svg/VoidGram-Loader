name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, voidgram-development, build-v18]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare bundled libimobiledevice tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "libimobile-suite.zip"
          $extract = Join-Path $env:RUNNER_TEMP "libimobile-suite"
          $url = "https://github.com/jrjr/libimobiledevice-windows/releases/download/v20261108-74585f8/libimobile-suite-latest_w64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "61e3fd1cc5ded01695cc464f3de8a7bf706c340cad9f2e142c4aafa747bf1324"
          if ($actual -ne $expected) { throw "libimobiledevice archive SHA-256 mismatch" }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          foreach ($tool in @("idevice_id.exe", "ideviceinfo.exe", "ideviceinstaller.exe")) {
            if (-not (Get-ChildItem -Path $extract -Recurse -Filter $tool | Select-Object -First 1)) {
              throw "Bundled suite does not contain $tool; refusing to create an incomplete installer"
            }
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/idevice" | Out-Null
          Copy-Item -Path (Join-Path $extract "*") -Destination "src-tauri/resources/idevice" -Recurse -Force
          Write-Host "Bundled iOS device tools:"
          Get-ChildItem "src-tauri/resources/idevice" -Recurse -File | Where-Object { $_.Name -match "^idevice_(id|info|installer)\.exe$" } | Select-Object -ExpandProperty FullName

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VoidGram-Loader-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
