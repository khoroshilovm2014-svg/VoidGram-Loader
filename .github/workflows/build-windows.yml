name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, voidgram-development, build-v18]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install a matched Windows build of libimobiledevice + ideviceinstaller.
      # The tools and their runtime DLLs are copied into the Tauri bundle.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ideviceinstaller
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-usbmuxd

      - name: Bundle iPhone support tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "C:\msys64\ucrt64\bin"
          foreach ($tool in @("idevice_id.exe", "ideviceinfo.exe", "ideviceinstaller.exe")) {
            $path = Join-Path $bin $tool
            if (-not (Test-Path $path)) { throw "Required tool missing from MSYS2: $tool" }
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/idevice" | Out-Null
          Copy-Item -Path (Join-Path $bin "*.exe") -Destination "src-tauri/resources/idevice" -Force
          Copy-Item -Path (Join-Path $bin "*.dll") -Destination "src-tauri/resources/idevice" -Force
          foreach ($tool in @("idevice_id.exe", "ideviceinfo.exe", "ideviceinstaller.exe")) {
            if (-not (Test-Path "src-tauri/resources/idevice/$tool")) { throw "Failed to bundle $tool" }
          }
          Write-Host "Bundled device tools and runtime DLLs:"
          Get-ChildItem "src-tauri/resources/idevice" -File | Measure-Object | Select-Object -ExpandProperty Count

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VoidGram-Loader-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
