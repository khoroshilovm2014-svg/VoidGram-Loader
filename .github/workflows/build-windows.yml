name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, voidgram-development, build-v18]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install a matched Windows build of libimobiledevice + ideviceinstaller.
      # The tools and their runtime DLLs are copied into the Tauri bundle.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ideviceinstaller
            mingw-w64-ucrt-x86_64-libimobiledevice
      - name: Bundle iPhone support tools
        shell: msys2 {0}
        working-directory: src-tauri
        run: |
          set -euo pipefail
          pwd
          mkdir -p resources/idevice
          for tool in idevice_id ideviceinfo ideviceinstaller; do
            command -v "$tool"
            cp "$(command -v "$tool")" resources/idevice/
          done
          cp /ucrt64/bin/*.dll resources/idevice/
          test -f resources/idevice/idevice_id.exe
          test -f resources/idevice/ideviceinfo.exe
          test -f resources/idevice/ideviceinstaller.exe
          echo "Bundled device tools and runtime DLLs:"
          find resources/idevice -maxdepth 1 -type f | wc -l

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm install

      - name: Verify bundled iPhone tools
        shell: pwsh
        run: |
          $tools = @("idevice_id.exe", "ideviceinfo.exe", "ideviceinstaller.exe")
          $folder = Join-Path $env:GITHUB_WORKSPACE "src-tauri/resources/idevice"
          foreach ($tool in $tools) {
            $path = Join-Path $folder $tool
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required bundled tool missing: $path" }
          }
          $count = (Get-ChildItem -LiteralPath $folder -File).Count
          if ($count -lt 4) { throw "Expected device tools and runtime DLLs in $folder; found $count files" }
          Write-Host "Verified $count bundled files in $folder"

      - name: Build Tauri installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VoidGram-Loader-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
