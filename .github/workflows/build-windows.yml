name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, voidgram-development, build-v18]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Install a matched Windows build of libimobiledevice + ideviceinstaller.
      # The tools and their runtime DLLs are copied into the Tauri bundle.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ideviceinstaller
            mingw-w64-ucrt-x86_64-libimobiledevice
      - name: Bundle iPhone support tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = @("idevice_id.exe", "ideviceinfo.exe", "ideviceinstaller.exe")
          $commands = @()
          foreach ($tool in $tools) {
            $command = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $command) { throw "Required MSYS2 command is not on PATH: $tool" }
            $commands += $command.Source
          }
          $bin = Split-Path $commands[0] -Parent
          New-Item -ItemType Directory -Force -Path "src-tauri/resources/idevice" | Out-Null
          foreach ($path in $commands) {
            Copy-Item -LiteralPath $path -Destination "src-tauri/resources/idevice" -Force
          }
          Get-ChildItem -Path $bin -Filter "*.dll" | Copy-Item -Destination "src-tauri/resources/idevice" -Force
          foreach ($tool in $tools) {
            if (-not (Test-Path "src-tauri/resources/idevice/$tool")) { throw "Failed to bundle $tool" }
          }
          Write-Host "Bundled device tools and runtime DLLs:"
          Get-ChildItem "src-tauri/resources/idevice" -File | Measure-Object | Select-Object -ExpandProperty Count

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VoidGram-Loader-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
